name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check -w apps/web
      - run: npm test
      - run: npm run build -w apps/web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t hqpweb:ci .
      - name: Start it and check health
        run: |
          docker run -d --name wc -p 4380:4380 hqpweb:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4380/api/health; then exit 0; fi
            sleep 1
          done
          docker logs wc
          exit 1
