# Quick start: `docker compose up -d --build`, then open http://<this-machine's-IP>:4380
# Optional settings go in a .env file next to this one (see README → Options).
services:
  controller:
    build: .
    image: web-controller:local
    container_name: web-controller
    restart: unless-stopped
    ports:
      # BIND_ADDRESS limits which interface publishes it (e.g. 127.0.0.1 behind a local proxy).
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-4380}:${PORT:-4380}"
    environment:
      PORT: ${PORT:-4380}
      # Only needed when you open the app by a hostname (IP addresses always work).
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    volumes:
      # Instances, presets and learned failures. Docker manages it; it survives updates.
      - config:/config

volumes:
  config:
